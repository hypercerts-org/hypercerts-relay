# Two real PDS containers with separately routed Cloudflare named tunnels.
#
# Run only with a private, ignored environment file:
#   docker compose --env-file .env.pds.fixture -f docker-compose.pds-fixture.yml up -d
#
# The PDS hostnames must be stable public HTTPS names before accounts are created.
# See developer.md for the identity, tunnel, and cleanup contract.
name: hypercerts-relay-pds-fixture

services:
  pds-a:
    # Upstream Bluesky PDS, pinned to the published source revision and OCI index.
    image: ghcr.io/bluesky-social/atproto:pds-2e1787c2bf5bd47b55c3df930d688bb40b5ae63d@sha256:bb3cf16505d319013fa717c45986fe3ea5264661be30f787a0901a5f1408330f
    restart: "no"
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: ${PDS_A_HOSTNAME:?set PDS_A_HOSTNAME in .env.pds.fixture}
      PDS_JWT_SECRET: ${PDS_A_JWT_SECRET:?set PDS_A_JWT_SECRET in .env.pds.fixture}
      PDS_ADMIN_PASSWORD: ${PDS_A_ADMIN_PASSWORD:?set PDS_A_ADMIN_PASSWORD in .env.pds.fixture}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_A_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:?set PDS_A_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX in .env.pds.fixture}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_DID_PLC_URL: ${PDS_A_DID_PLC_URL:?set PDS_A_DID_PLC_URL in .env.pds.fixture}
      PDS_SERVICE_HANDLE_DOMAINS: .${PDS_A_HOSTNAME:?set PDS_A_HOSTNAME in .env.pds.fixture}
      # Relay admission controls crawling for this fixture. Leave PDS_CRAWLERS
      # unset so the PDS does not advertise to a crawler independently.
      PDS_INVITE_REQUIRED: "true"
      PDS_RATE_LIMITS_ENABLED: "true"
      LOG_ENABLED: "true"
    volumes:
      - pds-a-data:/pds
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/xrpc/com.atproto.server.describeServer').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  pds-a-cloudflared:
    # Docker Hub cloudflared image pinned to the multi-architecture manifest list.
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: "no"
    network_mode: service:pds-a
    depends_on:
      pds-a:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${PDS_A_TUNNEL_TOKEN:?set PDS_A_TUNNEL_TOKEN in .env.pds.fixture}

  pds-b:
    # Upstream Bluesky PDS, pinned to the published source revision and OCI index.
    image: ghcr.io/bluesky-social/atproto:pds-2e1787c2bf5bd47b55c3df930d688bb40b5ae63d@sha256:bb3cf16505d319013fa717c45986fe3ea5264661be30f787a0901a5f1408330f
    restart: "no"
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: ${PDS_B_HOSTNAME:?set PDS_B_HOSTNAME in .env.pds.fixture}
      PDS_JWT_SECRET: ${PDS_B_JWT_SECRET:?set PDS_B_JWT_SECRET in .env.pds.fixture}
      PDS_ADMIN_PASSWORD: ${PDS_B_ADMIN_PASSWORD:?set PDS_B_ADMIN_PASSWORD in .env.pds.fixture}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_B_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:?set PDS_B_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX in .env.pds.fixture}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_DID_PLC_URL: ${PDS_B_DID_PLC_URL:?set PDS_B_DID_PLC_URL in .env.pds.fixture}
      PDS_SERVICE_HANDLE_DOMAINS: .${PDS_B_HOSTNAME:?set PDS_B_HOSTNAME in .env.pds.fixture}
      # Relay admission controls crawling for this fixture. Leave PDS_CRAWLERS
      # unset so the PDS does not advertise to a crawler independently.
      PDS_INVITE_REQUIRED: "true"
      PDS_RATE_LIMITS_ENABLED: "true"
      LOG_ENABLED: "true"
    volumes:
      - pds-b-data:/pds
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/xrpc/com.atproto.server.describeServer').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  pds-b-cloudflared:
    # Docker Hub cloudflared image pinned to the multi-architecture manifest list.
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: "no"
    network_mode: service:pds-b
    depends_on:
      pds-b:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${PDS_B_TUNNEL_TOKEN:?set PDS_B_TUNNEL_TOKEN in .env.pds.fixture}

volumes:
  pds-a-data:
  pds-b-data:
