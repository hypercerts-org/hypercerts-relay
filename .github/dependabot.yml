version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /cmd/relay
      - /cmd/rainbow
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories:
      - /cmd/relay
      - /cmd/rainbow
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
