name: Check Indigo upstream

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: indigo-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release bot token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: Check for an existing sync pull request
        id: existing
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          count=$(gh pr list --base main --state open --search 'Indigo upstream sync in:title' --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Fetch Indigo upstream
        if: steps.existing.outputs.count == '0'
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/bluesky-social/indigo.git 2>/dev/null || git remote set-url upstream https://github.com/bluesky-social/indigo.git
          git fetch upstream main
      - name: Apply allowed Indigo changes
        if: steps.existing.outputs.count == '0'
        id: prepare
        run: |
          set -euo pipefail
          branch="upstream-sync/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git switch -c "$branch" origin/main
          ./scripts/apply-upstream-update.sh
          if git diff --cached --quiet; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: apply allowed Indigo upstream changes $(git rev-parse --short upstream/main)"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo 'needed=true' >> "$GITHUB_OUTPUT"
      - name: Open Indigo upstream sync pull request
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse --short origin/main)
          upstream_sha=$(git rev-parse --short upstream/main)
          marked_paths=$(git grep -l 'hypercerts:' origin/main -- . || true)
          cat > pr-body.md <<EOF
          Applies the allowlisted Indigo changes through \`$upstream_sha\` to Hypercerts main \`$base_sha\`.

          This is a review-only upstream synchronization. It applies only the paths in \`.hypercerts/upstream-paths\`; it does not merge \`upstream/main\`, resolve conflicts, commit conflict markers, or merge this pull request.

          Review the full diff, every affected \`// hypercerts:\` edit, and Relay/Rainbow verification before merging.

          Hypercerts-marked files on main at creation:
          \`\`\`text
          ${marked_paths:-None found}
          \`\`\`
          EOF
          gh pr create --base main --head "$BRANCH" --title "chore: Indigo upstream sync $upstream_sha" --body-file pr-body.md
