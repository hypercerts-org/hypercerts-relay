name: Release

on:
  workflow_dispatch:
    inputs:
      tag_current_version:
        description: Create the missing tag for the checked-out package version without opening a Changesets version pull request.
        required: false
        default: false
        type: boolean
  pull_request:
    types: [closed]
    branches: [main]

concurrency: ${{ github.workflow }}-main

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'changeset-release/main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate release bot token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Check out release target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: Validate branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref }}" != 'refs/heads/main' ]; then
            echo "::error::Release workflow can only be dispatched from main."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Verify Relay and Rainbow
        run: ./scripts/verify.sh
      - name: Create the current version tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag_current_version
        run: npm run release
      - name: Create release pull request or tag release
        if: github.event_name != 'workflow_dispatch' || !inputs.tag_current_version
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: npm run release
          version: npm run version-packages
          title: 'prepare for release'
          commit: 'chore: release'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Validate release tag and component versions
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.tag_current_version) ||
          steps.changesets.outputs.published == 'true'
        run: npm run check-component-versions -- --require-tag
      - name: Rename release pull request with version
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail
          version=$(gh api \
            "repos/${{ github.repository }}/contents/package.json?ref=changeset-release/main" \
            -H 'Accept: application/vnd.github.raw' \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          gh pr edit "$PR_NUMBER" --title "prepare for release v$version"
