name: Publish Railway candidate images
run-name: Publish staging candidate images

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  publish-candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: railway-candidate-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Validate unified component versions
        run: npm run check-component-versions
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - name: Build and publish immutable candidate images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          COMMIT="$GITHUB_SHA"
          DATE="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          CANDIDATE_ID="sha-$GITHUB_SHA"

          existing_image() {
            docker buildx imagetools inspect "$1:$CANDIDATE_ID" --format '{{.Digest}}' 2>/dev/null
          }

          existing_count=0
          for component in relay jetstream administration; do
            if existing_image "$IMAGE_PREFIX/$component" >/dev/null; then
              existing_count=$((existing_count + 1))
            fi
          done
          if [ "$existing_count" -ne 0 ] && [ "$existing_count" -ne 3 ]; then
            echo "release candidate $CANDIDATE_ID has a partial image set; refusing to rebuild it" >&2
            exit 1
          fi

          build_component() {
            local component="$1"
            local context="$2"
            local dockerfile="$3"
            local image="$IMAGE_PREFIX/$component"
            local metadata
            local digest

            metadata="$(mktemp)"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=true \
              --push \
              --build-arg "VERSION=$VERSION" \
              --build-arg "COMMIT=$COMMIT" \
              --build-arg "DATE=$DATE" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.created=$DATE" \
              --tag "$image:$CANDIDATE_ID" \
              --metadata-file "$metadata" \
              --file "$dockerfile" \
              "$context"
            digest="$(jq -er '."containerimage.descriptor".digest' "$metadata")"
            rm -f "$metadata"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "unexpected digest for $component: $digest" >&2
              return 1
            fi
            printf '%s@%s' "$image" "$digest"
          }

          if [ "$existing_count" -eq 3 ]; then
            relay_image="$IMAGE_PREFIX/relay@$(existing_image "$IMAGE_PREFIX/relay")"
            jetstream_image="$IMAGE_PREFIX/jetstream@$(existing_image "$IMAGE_PREFIX/jetstream")"
            administration_image="$IMAGE_PREFIX/administration@$(existing_image "$IMAGE_PREFIX/administration")"
          else
            relay_image="$(build_component relay . cmd/relay/Dockerfile)"
            jetstream_image="$(build_component jetstream jetstream jetstream/Dockerfile)"
            administration_image="$(build_component administration . administration/Dockerfile)"
          fi
