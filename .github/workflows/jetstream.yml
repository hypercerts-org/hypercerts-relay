name: Verify Jetstream
on:
  pull_request:
    branches: [main]
    paths: ['jetstream/**', 'scripts/*jetstream*', '.hypercerts/jetstream-*', '.github/workflows/jetstream*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: jetstream/go.mod
          cache-dependency-path: jetstream/go.sum
      - run: python3 scripts/test_jetstream_upstream.py
      - run: ./scripts/verify-jetstream.sh
      - run: docker build -f jetstream/Dockerfile jetstream
