name: Verify administration
run-name: Verify administration (${{ github.event_name }}) — ${{ (github.base_ref || github.event.merge_group.base_ref || github.ref_name) == 'dev' && 'staging' || (github.base_ref || github.event.merge_group.base_ref || github.ref_name) == 'refs/heads/dev' && 'staging' || github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
on:
  pull_request:
    branches: [main, dev, production]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify administration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: jetstream/go.mod
          cache-dependency-path: |
            go.sum
            jetstream/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: administration/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: administration
      - run: npm run check && npm test && npm run test:components && npm run build
        working-directory: administration
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: administration
      - run: npm run test:browser
        working-directory: administration
      - run: git diff --check
