# Self-contained, disposable TECH-594 T01 topology.
#
# The runner writes an ignored environment file and invokes this manifest. It
# deliberately has no Cloudflare, public DNS, Railway, or production endpoint.
name: hypercerts-relay-acceptance

services:
  acceptance-caddy-data:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    restart: "no"
    volumes:
      - acceptance-caddy-data:/data
      - acceptance-caddy-config:/config
    command: ["/bin/sh", "-ec", "mkdir -p /data /config && chown -R 1000:1000 /data /config"]

  fault-proxy:
    build:
      context: ./tests/acceptance/fault-proxy
    restart: "no"
    expose:
      - "3000"
    networks:
      - acceptance

  caddy:
    build:
      context: ./tests/acceptance
      dockerfile: caddy/Dockerfile
    restart: "no"
    depends_on:
      acceptance-caddy-data:
        condition: service_completed_successfully
      fault-proxy:
        condition: service_started
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - acceptance-caddy-data:/data
      - acceptance-caddy-config:/config
    networks:
      acceptance:
        aliases:
          - plc.test
          - pds-a.test
          - pds-b.test

  acceptance-ca:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    restart: "no"
    depends_on:
      caddy:
        condition: service_started
    volumes:
      - acceptance-caddy-data:/caddy-data:ro
      - acceptance-ca:/certs
    command:
      - /bin/sh
      - -ec
      - |
        until test -f /caddy-data/caddy/pki/authorities/local/root.crt; do sleep 0.2; done
        cp /caddy-data/caddy/pki/authorities/local/root.crt /certs/root.crt
        chmod 0444 /certs/root.crt

  plc:
    build:
      context: ./tests/acceptance/plc
    restart: "no"
    expose:
      - "2582"
    networks:
      - acceptance

  pds-a:
    image: ghcr.io/bluesky-social/atproto:pds-2e1787c2bf5bd47b55c3df930d688bb40b5ae63d@sha256:bb3cf16505d319013fa717c45986fe3ea5264661be30f787a0901a5f1408330f
    restart: "no"
    depends_on:
      acceptance-ca:
        condition: service_completed_successfully
      plc:
        condition: service_started
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: pds-a.test
      PDS_JWT_SECRET: ${PDS_A_JWT_SECRET:?generated by tests/acceptance/run}
      PDS_ADMIN_PASSWORD: ${PDS_A_ADMIN_PASSWORD:?generated by tests/acceptance/run}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_A_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:?generated by tests/acceptance/run}
      PDS_DATA_DIRECTORY: /app/data
      PDS_BLOBSTORE_DISK_LOCATION: /app/data/blocks
      PDS_DID_PLC_URL: https://plc.test
      PDS_SERVICE_HANDLE_DOMAINS: .pds-a.test
      PDS_INVITE_REQUIRED: "false"
      PDS_RATE_LIMITS_ENABLED: "true"
      NODE_EXTRA_CA_CERTS: /certs/root.crt
    volumes:
      - acceptance-ca:/certs:ro
      - acceptance-pds-a:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/xrpc/com.atproto.server.describeServer').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      acceptance:
        aliases:
          - pds-a

  pds-b:
    image: ghcr.io/bluesky-social/atproto:pds-2e1787c2bf5bd47b55c3df930d688bb40b5ae63d@sha256:bb3cf16505d319013fa717c45986fe3ea5264661be30f787a0901a5f1408330f
    restart: "no"
    depends_on:
      acceptance-ca:
        condition: service_completed_successfully
      plc:
        condition: service_started
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: pds-b.test
      PDS_JWT_SECRET: ${PDS_B_JWT_SECRET:?generated by tests/acceptance/run}
      PDS_ADMIN_PASSWORD: ${PDS_B_ADMIN_PASSWORD:?generated by tests/acceptance/run}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_B_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:?generated by tests/acceptance/run}
      PDS_DATA_DIRECTORY: /app/data
      PDS_BLOBSTORE_DISK_LOCATION: /app/data/blocks
      PDS_DID_PLC_URL: https://plc.test
      PDS_SERVICE_HANDLE_DOMAINS: .pds-b.test
      PDS_INVITE_REQUIRED: "false"
      PDS_RATE_LIMITS_ENABLED: "true"
      NODE_EXTRA_CA_CERTS: /certs/root.crt
    volumes:
      - acceptance-ca:/certs:ro
      - acceptance-pds-b:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/xrpc/com.atproto.server.describeServer').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      acceptance:
        aliases:
          - pds-b

  acceptance-jetstream-data:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    restart: "no"
    volumes:
      - acceptance-jetstream:/data
    command: ["/bin/sh", "-ec", "mkdir -p /data && chown 65532:65532 /data"]

  acceptance-driver-data:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    restart: "no"
    volumes:
      - acceptance-driver:/state
    command: ["/bin/sh", "-ec", "mkdir -p /state && chown 1000:1000 /state"]

  acceptance-secrets:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    restart: "no"
    environment:
      RELAY_CONTROL_TOKEN: ${RELAY_CONTROL_TOKEN:?generated by tests/acceptance/run}
      JETSTREAM_CONTROL_TOKEN: ${JETSTREAM_CONTROL_TOKEN:?generated by tests/acceptance/run}
    volumes:
      - acceptance-secrets:/secrets
    # The Jetstream control credential is readable only from this disposable
    # volume, mounted into Jetstream and the in-network T15 driver.
    command: ["/bin/sh", "-ec", "umask 077; printf '%s\\n' \"$${RELAY_CONTROL_TOKEN}\" > /secrets/relay-control-token; chown 10001:10001 /secrets/relay-control-token; printf '%s\\n' \"$${JETSTREAM_CONTROL_TOKEN}\" > /secrets/jetstream-control-token; chown 65532:65532 /secrets/jetstream-control-token; chmod 0444 /secrets/jetstream-control-token"]

  relay:
    build:
      context: .
      dockerfile: tests/acceptance/Dockerfile.relay
    restart: "no"
    depends_on:
      acceptance-ca:
        condition: service_completed_successfully
      acceptance-secrets:
        condition: service_completed_successfully
    environment:
      SSL_CERT_FILE: /certs/root.crt
      RELAY_CONTROL_ADDR: 0.0.0.0:2471
      RELAY_CONTROL_TOKEN_FILE: /run/acceptance/relay-control-token
      RELAY_ADMIN_PASSWORD: ${RELAY_ADMIN_PASSWORD:?generated by tests/acceptance/run}
      RELAY_ACCEPTANCE_PRIVATE_HOSTS: "true"
      RELAY_API_BIND: 0.0.0.0:2470
      RELAY_METRICS_LISTEN: 127.0.0.1:2472
      DATABASE_URL: sqlite:///data/relay/relay.sqlite
      RELAY_PERSIST_DIR: /data/relay/events
      RELAY_REPLAY_WINDOW: 1h
      RELAY_DEFAULT_ACCOUNT_LIMIT: "10"
      RELAY_PLC_HOST: https://plc.test
    volumes:
      - acceptance-ca:/certs:ro
      - acceptance-secrets:/run/acceptance:ro
      - acceptance-relay:/data/relay
    networks:
      - acceptance

  jetstream:
    build:
      context: ./jetstream
      dockerfile: Dockerfile
      args:
        GO_BUILD_TAGS: acceptance
    restart: "no"
    depends_on:
      acceptance-ca:
        condition: service_completed_successfully
      acceptance-jetstream-data:
        condition: service_completed_successfully
      relay:
        condition: service_started
    environment:
      SSL_CERT_FILE: /certs/root.crt
      JETSTREAM_ADDR: 0.0.0.0:8080
      # Acceptance-only private control listener; no host port is published.
      JETSTREAM_DEBUG_ADDR: 0.0.0.0:8081
      JETSTREAM_CONTROL_TOKEN_FILE: /run/acceptance/jetstream-control-token
      JETSTREAM_ACCEPTANCE_PRIVATE_HOSTS: "true"
      JETSTREAM_RELAY_URL: http://relay:2470
      JETSTREAM_PLC_URL: https://plc.test
      JETSTREAM_DATA_DIR: /data
      JETSTREAM_COLLECTIONS: app.bsky.feed.post
      JETSTREAM_MAX_BACKFILL_REPOS: "10"
    volumes:
      - acceptance-ca:/certs:ro
      - acceptance-secrets:/run/acceptance:ro
      - acceptance-jetstream:/data
    ports:
      - 127.0.0.1:${JETSTREAM_HOST_PORT:?generated by tests/acceptance/run}:8080
    networks:
      - acceptance

  driver:
    build:
      context: ./tests/acceptance/driver
    restart: "no"
    depends_on:
      pds-a:
        condition: service_healthy
      pds-b:
        condition: service_healthy
      relay:
        condition: service_started
      jetstream:
        condition: service_started
      acceptance-driver-data:
        condition: service_completed_successfully
    environment:
      NODE_EXTRA_CA_CERTS: /certs/root.crt
      RELAY_CONTROL_TOKEN: ${RELAY_CONTROL_TOKEN:?generated by tests/acceptance/run}
    volumes:
      - acceptance-ca:/certs:ro
      - acceptance-secrets:/run/acceptance:ro
      - acceptance-driver:/state
    networks:
      - acceptance

networks:
  acceptance: {}

volumes:
  acceptance-ca:
  acceptance-caddy-config:
  acceptance-caddy-data:
  acceptance-driver:
  acceptance-jetstream:
  acceptance-pds-a:
  acceptance-pds-b:
  acceptance-relay:
  acceptance-secrets:
