# Automatic analysis configuration (not sonar-project.properties for a CI scanner).
# Keep maintained code in scope; classify colocated Go/Python tests separately.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/test_*.py
sonar.exclusions=**/*_test.go,**/test_*.py,jetstream/api/**
# This directory contains lexgen output; fix its generator rather than emitted code.
sonar.cpd.exclusions=jetstream/api/**
